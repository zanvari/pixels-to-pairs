[build-system]
requires = ["setuptools>=68,<82"]
build-backend = "setuptools.build_meta"

[project]
name = "pixels-to-pairs"
version = "0.1.0"
description = "Reproducible benchmark code for LLM-driven key-value extraction from document text under OCR noise."
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "torch",
    "transformers",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
